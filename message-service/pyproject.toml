# Mahaa Message service — tooling configuration.
#
# No [project] table on purpose: dependencies live in requirements.txt (the
# same single source the Dockerfile builds from), so there are not two lists to
# keep in step. This file exists for the tools the main backend also runs.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite talks to a local PostgreSQL only; conftest enforces that and
# skips honestly when no local database is configured.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F,C90,I — the same selection the main backend's CI runs.
select = ["E", "F", "C90", "I"]
ignore = ["E501"]
