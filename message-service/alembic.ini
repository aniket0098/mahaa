# Alembic — the message service's OWN migration environment.
#
# It runs against the same Neon PostgreSQL as the main backend but records its
# history in a DIFFERENT version table (`alembic_version_message_service`, set
# in alembic/env.py). Two services, two version tables, zero contention: the
# main backend's `alembic upgrade` never sees this service's revisions and
# this one never touches theirs. Sharing a version table would make the two
# histories race for a single row and is exactly the "two competing owners"
# failure this layout avoids.
#
# This environment only ever manages `message_requests`. It must be run AFTER
# the main backend's migrations (the table's foreign keys point at `users`),
# never against production from a developer machine, and never with
# `create_all` — see README.md.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The service's OWN version table — never `alembic_version`, which belongs to
# the main backend.
version_table = alembic_version_message_service

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
