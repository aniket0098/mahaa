[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mahaa-learn-service"
version = "0.1.0"
description = "Independent Learn microservice for MAHAJOB"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0.32,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyJWT>=2.8,<3.0",
    "aiobotocore>=3.15,<4.0",
]

dev-dependencies = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
learn-service = "app.main:create_app"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"