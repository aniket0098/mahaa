# Mahaa — Render Blueprint.
#
# Scope: the Mahaa backend only. It is a separate service from any other project
# and shares nothing with it — different credentials, no shared env var group.
#
# How a Blueprint is applied: Render → New → Blueprint → pick this repository.
# Apply it ONCE to create the service. After that, manage the service in the
# dashboard; re-applying is not the way to change settings.
#
# The database is NOT part of this Blueprint. It lives in Neon PostgreSQL, which
# is managed outside Render. The old Render-managed PostgreSQL resource has been
# deleted, so nothing here creates or references a Render PostgreSQL resource.
#
# No secret appears in this file. `DATABASE_URL` is `sync: false`, so the Neon
# connection string is set once in the dashboard and is never written down,
# committed, or pasted anywhere in this repository.

services:
  - type: web
    name: mahaa-backend-docker
    runtime: docker
    region: singapore
    # A scaffold, not a production plan. The free web service spins down when
    # idle, loses local files on redeploy, and restarts at Render's discretion.
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    # Liveness, not readiness: the health path must not depend on the database,
    # or a slow database would restart a healthy process in a loop.
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8000"

      # `production` enables the fail-closed checks in app/core/config.py: the
      # service refuses to start on a placeholder DATABASE_URL, on DEBUG=true,
      # or on a wildcard CORS origin.
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

      # The Neon PostgreSQL connection string, set once in the Render dashboard
      # and never stored in this repository. `app/core/config.py` rewrites the
      # driver to `postgresql+psycopg://` on the way in.
      - key: DATABASE_URL
        sync: false

      # The mobile app's base URL ends in /api/v1, which is a contract, not a
      # preference — it is the path prefix every route is mounted under.
      - key: API_PREFIX
        value: /api/v1

      # Exact origins, comma separated, never '*'. Set this in the dashboard
      # once the web client exists; the mobile app is unaffected because it
      # sends no Origin header.
      - key: CORS_ORIGINS
        sync: false

      # --- authentication must fail closed too -------------------------------
      # JWT_SECRET is required in production (fail-closed). Set this in the
      # Render dashboard to a random >=32-char string, e.g.:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_ISSUER
        value: "mahaa-api"
      - key: JWT_AUDIENCE
        value: "mahaa-mobile"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
  # ---------------------------------------------------------------------------
  # Message service (message-docker-service) — added for the Docker-first
  # message-service deployment preparation. The backend block above is
  # untouched; this block only ADDS a second web service in the same Blueprint.
  #
  # Build context notes (Render builds from the repository root):
  #   rootDir:        message-service   (build context = that directory)
  #   dockerfilePath: Dockerfile        (message-service/Dockerfile)
  # The image copies only message-service/app, alembic, alembic.ini,
  # pyproject.toml and requirements.txt — never backend/ or any .env file.
  #
  # Health: liveness GET /api/v1/health (never touches the database).
  # Readiness GET /api/v1/ready exists for operators but is NOT the Render
  # health check, for the same reason as the backend (see above).
  #
  # Database: the same Neon PostgreSQL the backend uses (managed outside
  # Render). No Render Postgres resource is created here. The message service
  # owns ONLY the message_requests table (FK to backend-owned users); run its
  # Alembic migration explicitly after pointing DATABASE_URL at Neon — never
  # automatically at startup, never against production without a backup and
  # owner approval (see message-service/docs/DOCKER_RENDER_DEPLOYMENT.md).
  #
  # Attachments: none in this service (REST-only, no file/object storage, no
  # container-local persistence). Nothing to provision.
  #
  # Auth: the mobile app signs in once against mahaa-backend-docker and sends
  # the same bearer token here, so JWT_SECRET / JWT_ISSUER / JWT_AUDIENCE MUST
  # be byte-identical to mahaa-backend-docker's values. They are sync: false
  # below — copy them in the dashboard, never into this file.
  #
  # Public URL placeholder: https://message-docker-service.onrender.com
  # (Render assigns the real host). The mobile app targets it with
  # EXPO_PUBLIC_MESSAGE_API_BASE_URL=<that host>/api/v1 — no code change.
  # ---------------------------------------------------------------------------
  - type: web
    name: message-docker-service
    runtime: docker
    region: singapore
    plan: free
    rootDir: message-service
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8001"

      # `production` enables the fail-closed checks in
      # message-service/app/core/config.py: refuses placeholder DATABASE_URL,
      # placeholder/short JWT_SECRET, DEBUG=true, or wildcard CORS.
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

      # Same Neon PostgreSQL as the backend. Set once in the dashboard.
      - key: DATABASE_URL
        sync: false

      # Shared-credential auth with the backend — copy the EXACT values from
      # mahaa-backend-docker in the dashboard.
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false

      # Exact origins, comma separated, never '*'. Empty is correct for a
      # mobile-only client (it sends no Origin header).
      - key: CORS_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Learn service (learn-docker-service) — independent Docker service for the
  # Learn section of the MAHAJOB application. Shares the same Neon PostgreSQL
  # database as the main backend and the same JWT credentials, but has its own
  # Docker image, process, and deployment lifecycle.
  #
  # Build context notes (Render builds from the repository root):
  #   rootDir:        services/learn-service   (build context = that directory)
  #   dockerfilePath: Dockerfile               (services/learn-service/Dockerfile)
  # The image copies only services/learn-service/app, alembic,
  # pyproject.toml and requirements.txt — never backend/ or any .env file.
  #
  # Health: liveness GET /api/v1/health (never touches the database).
  # Readiness GET /api/v1/ready exists for operators but is NOT the Render
  # health check, for the same reason as the backend.
  #
  # Database: the same Neon PostgreSQL the backend uses (managed outside
  # Render). No Render Postgres resource is created here.
  #
  # Auth: the mobile app signs in once against mahaa-backend-docker and sends
  # the same bearer token here, so JWT_SECRET / JWT_ISSUER / JWT_AUDIENCE MUST
  # be byte-identical to mahaa-backend-docker's values. They are sync: false
  # below — copy them in the dashboard, never into this file.
  #
  # Storage: S3/R2 object storage is configured through dashboard secrets
  # (VIDEO_STORAGE_KIND, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
  # S3_ENDPOINT, S3_REGION). Render ephemeral disk is never used as permanent
  # media storage.
  #
  # Public URL placeholder: https://learn-docker-service.onrender.com
  # (Render assigns the real host).
  # ---------------------------------------------------------------------------
  - type: web
    name: learn-docker-service
    runtime: docker
    region: singapore
    plan: free
    rootDir: services/learn-service
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8001"

      # `production` enables the fail-closed checks in app/core/config.py:
      # the service refuses to start on a placeholder DATABASE_URL, on
      # DEBUG=true, or on a wildcard CORS origin.
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

      # Same Neon PostgreSQL as the backend. Set once in the dashboard.
      - key: DATABASE_URL
        sync: false

      # Shared-credential auth with the backend — copy the EXACT values from
      # mahaa-backend-docker in the dashboard.
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_ISSUER
        value: "mahaa-api"
      - key: JWT_AUDIENCE
        value: "mahaa-mobile"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Object storage (S3/R2). Render ephemeral disk is never permanent media
      # storage; these are supplied by dashboard secrets.
      - key: VIDEO_STORAGE_KIND
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false

      # Exact origins, comma separated, never '*'. Empty is correct for a
      # mobile-only client (it sends no Origin header).
      - key: CORS_ORIGINS
        sync: false
  # test marker
  # ---------------------------------------------------------------------------
  # Learn service (learn-docker-service) � independent Docker service for the Learn section of the MAHAJOB application. Shares the same Neon PostgreSQL database as the main backend and the same JWT credentials, but has its own Docker image, process, and deployment lifecycle.
