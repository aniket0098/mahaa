# Mahaa — Render Blueprint.
#
# Scope: the Mahaa backend only. It is a separate service from any other project
# and shares nothing with it — different credentials, no shared env var group.
#
# How a Blueprint is applied: Render → New → Blueprint → pick this repository.
# Apply it ONCE to create the service. After that, manage the service in the
# dashboard; re-applying is not the way to change settings.
#
# The database is NOT part of this Blueprint. It lives in Neon PostgreSQL, which
# is managed outside Render. The old Render-managed PostgreSQL resource has been
# deleted, so nothing here creates or references a Render PostgreSQL resource.
#
# No secret appears in this file. `DATABASE_URL` is `sync: false`, so the Neon
# connection string is set once in the dashboard and is never written down,
# committed, or pasted anywhere in this repository.

services:
  - type: web
    name: mahaa-backend-docker
    runtime: docker
    region: singapore
    # A scaffold, not a production plan. The free web service spins down when
    # idle, loses local files on redeploy, and restarts at Render's discretion.
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    # Liveness, not readiness: the health path must not depend on the database,
    # or a slow database would restart a healthy process in a loop.
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8000"

      # `production` enables the fail-closed checks in app/core/config.py: the
      # service refuses to start on a placeholder DATABASE_URL, on DEBUG=true,
      # or on a wildcard CORS origin.
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

      # The Neon PostgreSQL connection string, set once in the Render dashboard
      # and never stored in this repository. `app/core/config.py` rewrites the
      # driver to `postgresql+psycopg://` on the way in.
      - key: DATABASE_URL
        sync: false

      # The mobile app's base URL ends in /api/v1, which is a contract, not a
      # preference — it is the path prefix every route is mounted under.
      - key: API_PREFIX
        value: /api/v1

      # Exact origins, comma separated, never '*'. Set this in the dashboard
      # once the web client exists; the mobile app is unaffected because it
      # sends no Origin header.
      - key: CORS_ORIGINS
        sync: false
