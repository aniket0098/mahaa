# Mahaa — Render Blueprint.
#
# Scope: the Mahaa backend only. It is a separate service from any other project
# and shares nothing with it — different database, different credentials, no
# shared env var group.
#
# How a Blueprint is applied: Render → New → Blueprint → pick this repository.
# Apply it ONCE to create the service and its database. After that, manage the
# service in the dashboard; re-applying is not the way to change settings.
#
# No secret appears in this file. `DATABASE_URL` is a `fromDatabase` reference,
# so Render injects the connection string it generated and the password is never
# written down, committed, or pasted anywhere.

databases:
  # A dedicated database for Mahaa. Render supplies `connectionString` as a
  # `postgresql://` URL; `app/core/config.py` rewrites the driver to
  # `postgresql+psycopg://` on the way in.
  - name: mahaa-db
    databaseName: mahaa
    # Major version is pinned so that a future bump is a deliberate edit rather
    # than a surprise upgrade on the next deploy. 16 is current and supported;
    # Render's most recent is 18.
    postgresMajorVersion: "16"
    # Must match the service's region below, so their connection stays on
    # Render's private network instead of leaving the region.
    region: singapore
    # 'free' is the only valid identifier for the free tier. Every other Render
    # plan ID is a <cpu>-<ram> pair such as '0.5c-512mb' or '1c-2g'; 'free' is the
    # documented exception to that format. A value like 'free-256mb' matches
    # nothing in the spec and is rejected when the Blueprint is applied.
    #
    # THE FREE DATABASE DELETES ITSELF AFTER 30 DAYS. On expiry it becomes
    # inaccessible, you get 14 further days to upgrade, and then Render deletes
    # it along with all of its data. It is also capped at 1 GB with no backups
    # of any kind, and only one free database is allowed per workspace. This is
    # a throwaway for proving the deploy works end to end; move to a paid plan
    # before any real data exists.
    plan: free

services:
  - type: web
    name: mahaa-backend
    runtime: python
    # Must match the database's region above.
    region: singapore
    # A scaffold, not a production plan. The free web service spins down when
    # idle, loses local files on redeploy, and restarts at Render's discretion.
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT. `--host 0.0.0.0` is required: binding to loopback
    # makes the service unreachable from outside the container.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness, not readiness: the health path must not depend on the database,
    # or a slow database would restart a healthy process in a loop.
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"

      # `production` enables the fail-closed checks in app/core/config.py: the
      # service refuses to start on a placeholder DATABASE_URL, on DEBUG=true,
      # or on a wildcard CORS origin.
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

      # Injected by Render from the database defined above. The value is never
      # written in this file and never needs to be pasted into the dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: mahaa-db
          property: connectionString

      # The mobile app's base URL ends in /api/v1, which is a contract, not a
      # preference — it is the path prefix every route is mounted under.
      - key: API_PREFIX
        value: /api/v1

      # Exact origins, comma separated, never '*'. Set this in the dashboard
      # once the web client exists; the mobile app is unaffected because it
      # sends no Origin header.
      - key: CORS_ORIGINS
        sync: false
