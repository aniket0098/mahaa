# Alembic configuration for the Mahaa backend.
#
# The database URL is intentionally NOT set here. `alembic/env.py` reads it from
# application settings, so there is exactly one place a connection string is
# configured and no chance of Alembic migrating a different database than the
# application.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# New revisions are named `<revision>_<slug>.py`; readable names make a long
# migration history navigable.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
