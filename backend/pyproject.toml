[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# The backend had no ruff configuration; these are the defaults plus the
# per-file exceptions below, stated explicitly so the exceptions are visible
# rather than looking like an accident.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship annotations as strings at mapper-configuration
# time, looking the name up in that module's namespace. A model in `skills.py`
# that points at `User` therefore *must* quote the forward reference, because
# `User` is not imported there — and ruff is right that an unquoted name would be
# undefined. Both rules are the same single fact seen from two sides, so both are
# disabled for the model layer only. Every other rule still applies there.
"app/models/*" = ["UP037", "F821"]
# `tests/conftest.py` is imported by name from the test modules, which ruff reads
# as third-party import ordering; the helpers are used.
"tests/test_models.py" = ["I001"]
# Pre-existing findings, unchanged by Phase 1 and outside its scope. Recording
# them here is deliberate: editing an unrelated module to satisfy a lint rule the
# project never opted into would be exactly the unrelated refactor Phase 1 must
# not make. `errors.py` (a long line) and `logging.py` (a `timezone.utc` that a
# modern linter prefers as the `UTC` alias) are the two pre-existing offenders.
"app/core/errors.py" = ["E501"]
"app/core/logging.py" = ["UP017"]
# The Phase 1 migration is long lines of SQL because that is the shape a
# constraint has to be written in. Re-wrapping them would not shorten them, and
# it would edit a file that has already been applied to a database. Recorded
# rather than fixed for the same reason as the two above.
"alembic/versions/*" = ["E501"]

